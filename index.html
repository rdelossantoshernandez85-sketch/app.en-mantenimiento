<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento del Juego</title>
    <style>
        /* Importamos una fuente pixelada para mantener la estética */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #e3c498; /* Color arena similar a tu screenshot */
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            color: #d32f2f; /* Rojo como la barra de vida */
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #fff;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            max-width: 600px;
            margin: 0 auto 40px auto;
            background: rgba(255, 255, 255, 0.5);
            padding: 15px;
            border: 2px solid #333;
        }

        /* Estilos para los personajes animados (CSS puro) */
        .workers-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-top: 20px;
        }

        .worker {
            width: 40px;
            height: 40px;
            position: relative;
        }

        /* Cuerpo del personaje */
        .worker::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 5px;
            width: 30px;
            height: 30px;
            background-color: #333;
            border: 2px solid #000;
        }

        /* Cabeza */
        .worker::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 5px;
            width: 30px;
            height: 30px;
            background-color: #ffccaa; /* Piel */
            border: 2px solid #000;
        }

        /* Casco de construcción */
        .helmet {
            position: absolute;
            top: -25px;
            left: 5px;
            width: 35px;
            height: 15px;
            background-color: #ffeb3b; /* Amarillo casco */
            border: 2px solid #000;
            border-bottom: none;
        }

        /* Animación de trabajar */
        .working {
            animation: work 0.5s infinite alternate;
        }

        .working::after {
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes work {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        /* Detalle: Herramienta (pico) */
        .tool {
            position: absolute;
            top: 40px;
            right: -10px;
            width: 5px;
            height: 20px;
            background-color: #5d4037;
            transform: rotate(45deg);
        }

        /* Botón de acción */
        .btn {
            background-color: #0077b6;
            color: white;
            border: 2px solid #000;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        /* Partículas de polvo (decoración) */
        .dust {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #8d6e63;
            border-radius: 50%;
            opacity: 0.6;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>🚧 EN MANTENIMIENTO 🚧</h1>
        <p>
            El juego está siendo actualizado por nuestro equipo de expertos.<br>
            Estamos modificando código y puliendo cada detalle para traerte la mejor experiencia.
            <br><br>
            <strong>¡Vuelve más tarde!</strong>
        </p>

        <!-- Animación de los trabajadores -->
        <div class="workers-container">
            <div class="worker working">
                <div class="helmet"></div>
                <div class="tool"></div>
            </div>
            <div class="worker working" style="animation-delay: 0.2s;">
                <div class="helmet" style="background-color: #ef5350;"></div>
                <div class="tool" style="transform: rotate(135deg);"></div>
            </div>
            <div class="worker working" style="animation-delay: 0.4s;">
                <div class="helmet" style="background-color: #4caf50;"></div>
                <div class="tool"></div>
            </div>
        </div>
    </div>

    <script>
        // Script para generar partículas de polvo aleatorias
        function createDust() {
            const dust = document.createElement('div');
            dust.classList.add('dust');
            
            // Posición aleatoria cerca de los trabajadores (centro inferior)
            const x = Math.random() * window.innerWidth;
            const y = window.innerHeight - 50 - Math.random() * 50;
            
            dust.style.left = x + 'px';
            dust.style.top = y + 'px';
            
            // Tamaño aleatorio
            const size = Math.random() * 4 + 2;
            dust.style.width = size + 'px';
            dust.style.height = size + 'px';

            document.body.appendChild(dust);

            // Animación simple de desvanecimiento
            setTimeout(() => {
                dust.style.opacity = 0;
                dust.style.transform = `translate(${Math.random() * 20 - 10}px, -20px)`;
            }, 100);

            // Eliminar elemento después de la animación
            setTimeout(() => {
                dust.remove();
            }, 1000);
        }

        // Crear polvo cada cierto tiempo
        setInterval(createDust, 300);
    </script>

</body>
</html>
